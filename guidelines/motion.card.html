<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--sans);background:#fff;padding:18px}</style></head><body><div style="font-size:13.5px;line-height:1.9;color:var(--ink-2)">

  <b style="color:var(--ink)">Count-ups</b> on stats · 1.1s cubic ease-out</div></body></html>
