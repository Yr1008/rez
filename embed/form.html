<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Request a demo</title>
<!--
  NOT A PAGE. This is the form fragment the Request-a-demo modal displays; it is
  never linked, never indexed, and a top-level visit bounces to the site (see the
  guard at the bottom).

  It exists as its own document so the HubSpot standard embed can render its
  hosted iframe without adding third-party scripts to the site document.
  /embed/* carries a policy scoped to this fragment (see
  scripts/prepare-deploy.sh), while every real page stays strict.

  Keep the snippet below byte-identical to what the HubSpot portal generates.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:transparent; }
  body {
    font-family:'Open Sans', system-ui, -apple-system, sans-serif;
    font-size:14.5px; line-height:1.6; color:#141414;
    -webkit-font-smoothing:antialiased;
  }
  a { color:#6651a8; }
  #trouble { display:none; color:#5f5952; font-size:13.5px; line-height:1.55; }
  #trouble a { font-weight:600; }
  #diag { display:none; margin:10px 0 0; color:#b3382c; font-size:12px; word-break:break-all; }
</style>
<script>
  /* Nobody should land here as a page. If this document is opened top-level,
     send them to the site, where the CTAs open the form in the modal. */
  if (window.top === window.self) location.replace('/Rezonate.dc');
</script>
</head>
<body>

<!-- Keep this snippet identical to the standard embed generated by HubSpot. -->
<script src="https://js.hsforms.net/forms/embed/4034633.js" defer></script>
<div class="hs-form-frame" data-region="na1" data-form-id="260ae856-9aa9-4c33-8a63-d7adbf586e29" data-portal-id="4034633"></div>

<p id="trouble">
  The form could not be loaded — an ad blocker or network filter may be blocking it.
  Please email us at <a href="mailto:hello@getrezonate.com">hello@getrezonate.com</a>
  and we’ll get right back to you.
</p>
<p id="diag"></p>

<script>
  /* If HubSpot has not rendered after 8s, offer the e-mail route rather than an
     empty box. And if the browser blocks part of the pipeline, name the
     directive right here - a screenshot of the modal is then enough to diagnose
     it, no developer console needed. */
  setTimeout(function () {
    var box = document.querySelector('.hs-form-frame');
    if (box && box.querySelector('iframe')) return;
    document.getElementById('trouble').style.display = 'block';
  }, 8000);

  document.addEventListener('securitypolicyviolation', function (e) {
    var box = document.querySelector('.hs-form-frame');
    if (box && box.querySelector('iframe')) return;
    if (!/\.hsforms\.net(?:\/|$)/.test(String(e.blockedURI || ''))) return;
    document.getElementById('trouble').style.display = 'block';
    var d = document.getElementById('diag');
    d.style.display = 'block';
    d.textContent = 'Diagnostic: blocked "' + e.effectiveDirective + '" for '
      + String(e.blockedURI || '').split('?')[0].slice(0, 90);
  });
</script>

</body>
</html>
