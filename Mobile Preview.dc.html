<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#c9c6c0;font-family:'Bricolage Grotesque',system-ui,sans-serif}
</style>
</helmet>
<div style="position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:16px 64px;background:rgba(201,198,192,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)">
  <span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6d6862;margin-right:8px">Page</span>
  <sc-for list="{{ chips }}" as="ch" hint-placeholder-count="7">
    <button onClick="{{ ch.onClick }}" style="font-family:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer;border:1px solid {{ ch.bd }};background:{{ ch.bg }};color:{{ ch.fg }}">{{ ch.label }}</button>
  </sc-for>
</div>
<div style="display:flex;gap:64px;align-items:flex-start;padding:24px 64px 56px;overflow-x:auto;min-height:100vh;box-sizing:border-box">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;flex:0 0 auto">
    <div style="font-size:14px;font-weight:600;letter-spacing:-.01em;color:#3a3733">iPhone <span style="color:#8a857d;font-weight:500">· 390 × 844</span></div>
    <div style="position:relative;width:390px;height:844px;border-radius:56px;background:#0c0d10;padding:12px;box-shadow:0 40px 90px -30px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06)">
      <div style="position:absolute;top:24px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;z-index:5"></div>
      <div style="width:100%;height:100%;border-radius:44px;overflow:hidden;background:#06070a;position:relative">
        <iframe src="{{ page }}" title="iPhone" loading="eager" style="border:0;width:100%;height:100%;display:block;background:#06070a"></iframe>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;flex:0 0 auto">
    <div style="font-size:14px;font-weight:600;letter-spacing:-.01em;color:#3a3733">iPad <span style="color:#8a857d;font-weight:500">· 834 × 1112</span></div>
    <div style="position:relative;width:834px;height:1112px;border-radius:38px;background:#0c0d10;padding:16px;box-shadow:0 40px 90px -30px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06)">
      <div style="width:100%;height:100%;border-radius:24px;overflow:hidden;background:#06070a;position:relative">
        <iframe src="{{ page }}" title="iPad" loading="eager" style="border:0;width:100%;height:100%;display:block;background:#06070a"></iframe>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'Customers.dc.html' };
  PAGES(){ return [
    ['Home','Rezonate.dc.html'],
    ['Solutions','Solutions.dc.html'],
    ['Healthcare','Industry-Healthcare.dc.html'],
    ['Finance','Industry-Financial.dc.html'],
    ['Business','Industry-Business.dc.html'],
    ['Sports','Industry-Sports.dc.html'],
    ['Customers','Customers.dc.html'],
    ['About','About.dc.html'],
    ['Careers','Careers.dc.html'],
  ]; }
  renderVals(){
    return {
      page: this.state.page,
      chips: this.PAGES().map(([label, file]) => {
        const on = this.state.page === file;
        return {
          label,
          onClick: () => this.setState({ page: file }),
          bg: on ? '#1A1510' : 'rgba(255,255,255,.55)',
          fg: on ? '#fff' : '#1A1510',
          bd: on ? '#1A1510' : 'rgba(26,21,16,.2)'
        };
      })
    };
  }
}
</script>
</body>
</html>
