<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Hear Kira, live voice demo</title>
<link rel="icon" type="image/png" sizes="32x32" href="rz/favicon-32.png">
<link rel="preload" as="font" type="font/woff2" href="rz/fonts/bricolage-grotesque-latin.woff2" crossorigin>
<link rel="stylesheet" href="rz/site.css?v=58">
<script defer src="rz/premium.js?v=2"></script>
<style>
@keyframes kvxpan{0%,100%{transform:translate(-4%,-2%)}50%{transform:translate(4%,2%)}}
@keyframes kvxpulse{0%,100%{box-shadow:0 0 0 0 rgba(20,16,12,.14)}50%{box-shadow:0 0 0 14px rgba(20,16,12,0)}}
.kvx{font-family:var(--sans)}
.kvx *{box-sizing:border-box}
.kvx .kvx-panel{position:relative;max-width:1180px;margin:0 auto;background:transparent;padding:clamp(20px,2.4vw,32px) clamp(16px,2.4vw,32px) clamp(16px,2vw,24px)}
.kvx .kvx-tabs{position:relative;display:flex;gap:6px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:999px;background:rgba(20,16,12,.045);width:fit-content;margin:0 auto;max-width:100%;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.kvx .kvx-tabs::-webkit-scrollbar{display:none}
.kvx .kvx-tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:14px;color:#8B8378;background:transparent;padding:10px 20px;border-radius:999px;white-space:nowrap;transition:color .2s,background .25s,box-shadow .25s}
.kvx .kvx-tab .dot{width:10px;height:10px;border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto}
.kvx .kvx-tab:hover{color:#3A322A}
.kvx .kvx-tab[data-on="1"]{background:transparent;color:var(--ink)}
.kvx .kvx-stage{display:flex;flex-direction:column;align-items:center;padding:clamp(20px,2.6vw,38px) 12px clamp(14px,2vw,24px)}
.kvx .kvx-orb{position:relative;width:clamp(190px,23vw,280px);aspect-ratio:1;border-radius:50%;background-size:0 0;box-shadow:0 30px 60px -38px rgba(20,16,12,.42);transition:transform .6s cubic-bezier(.2,.8,.3,1)}
.kvx .kvx-orbimg{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:inherit;pointer-events:none}
.kvx .kvx-orbimg::before{content:"";position:absolute;inset:-9%;background:inherit;background-size:cover;background-position:50% 50%;background-repeat:no-repeat;animation:kvxpan 8s ease-in-out infinite}
.kvx .kvx-call{z-index:2}
.kvx .kvx-call{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;overflow:hidden;background:none;color:#fff;display:grid;place-items:center;text-decoration:none;border:none;animation:kvglow 3.2s ease-in-out infinite;transition:transform .2s,box-shadow .3s}
.kvx .kvx-call::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#B79DE8,#D9605A,#E2683E,#EFA12E,#B79DE8);animation:kvspinb 4s linear infinite}
.kvx .kvx-call .rg,.kvx .kvx-call .rr{position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .55s cubic-bezier(.22,.9,.28,1);animation:kvspinb 2.4s linear infinite;pointer-events:none}
.kvx .kvx-call .rg{background:conic-gradient(from 0deg,#3ED27E,#2BB86A,#7FE3AC,#3ED27E)}
.kvx .kvx-call .rr{background:conic-gradient(from 0deg,#E5483C,#C43A30,#F07A6E,#E5483C)}
.kvx .kvx-call::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#141210;transition:background .5s ease;z-index:1}
.kvx .kvx-call svg{position:relative;z-index:2}
.kvx .kvx-call{transition:transform .55s cubic-bezier(.22,.9,.28,1),box-shadow .55s cubic-bezier(.22,.9,.28,1)}
.kvx .kvx-call:hover{transform:translateX(-50%) scale(1.07);box-shadow:0 0 24px 3px rgba(62,210,126,.45),0 10px 30px -10px rgba(62,210,126,.55)}
.kvx .kvx-call:hover .rg{opacity:1}
@keyframes kvspinb{to{transform:rotate(1turn)}}
@keyframes kvglow{0%,100%{box-shadow:0 10px 24px -8px rgba(20,16,12,.35)}50%{box-shadow:0 12px 30px -8px rgba(20,16,12,.45),0 0 18px 0 rgba(226,104,62,.25)}}
/* live call: slow green breathing = mic on */
@keyframes kvlive{0%,100%{box-shadow:0 0 10px 0 rgba(62,210,126,.25)}50%{box-shadow:0 0 28px 5px rgba(62,210,126,.6)}}
.kvx .kvx-orb[data-live="1"] .kvx-call{animation:kvlive 2.6s ease-in-out infinite}
.kvx .kvx-orb[data-live="1"] .kvx-call .rg{opacity:1;animation-duration:6s}
/* hover during live call: red = hang up */
.kvx .kvx-orb[data-live="1"] .kvx-call:hover{box-shadow:0 0 24px 4px rgba(229,72,60,.5)}
.kvx .kvx-orb[data-live="1"] .kvx-call:hover .rg{opacity:0}
.kvx .kvx-orb[data-live="1"] .kvx-call:hover .rr{opacity:1}
.kvx .kvx-orb[data-live="1"] .kvx-call:hover::after{background:#7A1F18}
.kvx kira-voice-agent{display:block}
.kvx .kvx-name{margin-top:26px;font-weight:600;font-size:clamp(16px,1.5vw,20px);color:var(--ink);letter-spacing:-.02em}
.kvx .kvx-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.kvx .kvx-chip{font-family:var(--sans);font-weight:500;font-size:13px;color:#6F665B;background:rgba(20,16,12,.05);border:none;padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .2s;min-height:38px}
.kvx .kvx-chip:hover{color:var(--ink);background:rgba(20,16,12,.09)}
.kvx .kvx-chip[data-on="1"]{background:#1A1510;color:#F5F3EF}
.kvx .kvx-recs{display:flex;gap:clamp(18px,3vw,44px);justify-content:center;align-items:flex-start;padding:clamp(20px,2.6vw,38px) 12px clamp(14px,2vw,24px);flex-wrap:wrap}
.kvx .kvx-rec{position:relative;border:0;background:transparent;cursor:pointer;width:clamp(150px,17vw,220px);font-family:var(--sans);padding:0}
.kvx .kvx-rec .orb::before{content:"";position:absolute;inset:-9%;background:inherit;background-size:cover;background-position:50% 50%;background-repeat:no-repeat;animation:kvxpan 10s ease-in-out infinite}
.kvx .kvx-rec .orb>*{position:relative;z-index:1}
.kvx .kvx-rec .orb{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 26px 55px -34px rgba(20,16,12,.45);transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.kvx .kvx-rec:hover .orb{transform:scale(1.04);box-shadow:0 30px 62px -32px rgba(20,16,12,.55)}
.kvx .kvx-rec .pb{transition:transform .3s cubic-bezier(.2,.8,.3,1),background .3s,color .3s,box-shadow .3s}
.kvx .kvx-rec:hover .pb{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 20px 2px rgba(62,210,126,.45)}
.kvx .kvx-rec .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#141210;box-shadow:0 6px 18px rgba(20,16,12,.3)}
.kvx .eqbars{display:flex;align-items:center;gap:2.5px;height:18px}
.kvx .eqbars i{display:block;width:3px;height:100%;border-radius:9px;background:currentColor;transform-origin:center;transform:scaleY(.3);animation:kvxeq 1s ease-in-out infinite}
.kvx .eqbars i:nth-child(2){animation-delay:.22s}.kvx .eqbars i:nth-child(3){animation-delay:.44s}.kvx .eqbars i:nth-child(4){animation-delay:.66s}
@keyframes kvxeq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.kvx .kvx-rec[data-playing="1"] .pb{box-shadow:0 0 20px 2px rgba(62,210,126,.45)}
.kvx .kvx-rec[data-playing="1"] .orb::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);animation:kvxlivering 2.2s ease-in-out infinite}
@keyframes kvxlivering{0%,100%{opacity:.35}50%{opacity:.9}}
.kvx .kvx-rec .t{margin-top:16px;font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.01em}
.kvx .kvx-rec .d{margin-top:6px;font-size:12.5px;line-height:1.45;color:#8B8378}
.kvx .kvx-foot{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;padding:12px 6px 2px}
.kvx .kvx-foot .who{display:flex;align-items:center;gap:10px;min-width:0}
.kvx .kvx-foot .who .morb{width:30px;height:30px;border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto}
.kvx .kvx-foot .who span{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kvx .kvx-mode button[data-dis="1"]{opacity:.35;pointer-events:none;cursor:default}
  .kvx .kvx-mode{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:rgba(20,16,12,.045)}
.kvx .kvx-mode button{position:relative;z-index:1;border:0;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:13.5px;color:#8B8378;background:transparent;padding:9px 18px;border-radius:999px;white-space:nowrap;transition:all .25s;min-height:38px}
.kvx .kvx-mode button[data-on="1"]{background:transparent;color:var(--ink)}
.kvx .pillslide{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:#fff;box-shadow:0 4px 14px -6px rgba(20,16,12,.25);transition:left .35s cubic-bezier(.2,.8,.3,1),width .35s cubic-bezier(.2,.8,.3,1),opacity .2s;z-index:0;opacity:0}
.kvx .kvx-cta{display:inline-flex;align-items:center;height:44px;padding:0 22px;border-radius:999px;background:#141210;color:#fff;font-family:var(--sans);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:transform .2s}
.kvx .kvx-cta{transition:transform .5s cubic-bezier(.22,.9,.28,1),box-shadow .5s cubic-bezier(.22,.9,.28,1),background .4s ease}
.kvx .kvx-cta:hover{transform:scale(1.035);box-shadow:0 10px 26px -12px rgba(20,16,12,.4)}
.kvx a.kvx-cta[href*="Customers"]:hover{background:rgba(20,16,12,.12)}
@media(max-width:640px){
  .kvx .kvx-tabs{max-width:calc(100vw - 32px)}
  .kvx .kvx-tab{flex:0 0 auto;scroll-snap-align:center}
}
@media(max-width:900px){
  .kvx .kvx-orb{width:min(52vw,300px)}
  .kvx .kvx-rec{width:clamp(140px,26vw,190px)}
}
@media(max-width:560px){
  .kvx .kvx-panel{border-radius:26px}
  /* single-row slider carousel: pill box, pill tabs, horizontal scroll */
  .kvx .kvx-tabs{max-width:calc(100vw - 28px);gap:4px}
  .kvx .kvx-tab{padding:11px 15px;font-size:13.5px;min-height:44px}
  .kvx .kvx-foot{gap:14px;margin-top:12px}
  .kvx .kvx-orb{width:min(64vw,260px)}
  .kvx .kvx-recs{gap:18px}
  .kvx .kvx-rec{width:calc(50% - 10px)}
}
@media(max-width:430px){
  /* all 4 industry tabs must be visible at once: drop the color dots + tighten */
  .kvx .kvx-tab .dot{display:none}
  .kvx .kvx-tabs{gap:3px;padding:3px}
  .kvx .kvx-tab{padding:10px 11px;font-size:13px}
}
@media(max-width:374px){
  .kvx .kvx-tab{padding:10px 9px;font-size:12.5px}
}
</style>
</helmet>
<div class="kvx" style="background:#EEEDE9;padding:clamp(40px,4.6vw,68px) clamp(10px,1.6vw,20px)">
  <div class="kvx-panel" data-py="0.05">

    <div style="text-align:center;margin-top:clamp(6px,1vw,12px)">
      <h2 style="color:var(--ink);font-weight:600;font-size:clamp(28px,4.2vw,55px);margin:0;line-height:1.04;letter-spacing:-.035em">Don't read about it. <span style="background:linear-gradient(115deg,#B79DE8,#D9605A 46%,#E2683E 72%,#EFA12E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:.12em;margin-bottom:-.12em;color:#D9605A">Talk to it.</span></h2>
      <p style="margin:12px auto 0;max-width:46ch;font-size:clamp(14px,1.2vw,16.5px);line-height:1.5;color:#6F665B">{{ sub }}</p>
    </div>

    <sc-if value="{{ showModeToggle }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;justify-content:center;margin-top:18px">
      <div class="kvx-mode">
        <button data-on="{{ liveOn }}" onClick="{{ setLive }}">Live agent</button>
        <button data-on="{{ recOn }}" data-dis="{{ recDisabled }}" onClick="{{ setRec }}" title="Recordings for this industry are coming soon">Hear a recorded call</button>
      </div>
    </div>
    </sc-if>
    <div class="kvx-tabs" data-rv data-in="1" style="margin-top:12px">
      <sc-for list="{{ industries }}" as="ind" hint-placeholder-count="4">
        <button class="kvx-tab" data-on="{{ ind.on }}" onClick="{{ ind.onClick }}"><span class="dot" style="background-image:url({{ ind.orb }})"></span>{{ ind.label }}</button>
      </sc-for>
    </div>

    <sc-if value="{{ modeLive }}" hint-placeholder-val="{{ true }}">
      <div class="kvx-stage">
        <div class="kvx-orb" data-live="{{ callLive }}" style="background-image:url({{ orbImg }})">
          <span class="kvx-orbimg" aria-hidden="true"></span>
          <kira-voice-agent headless demo-token="{{ demoToken }}" convex-url="{{ convexUrl }}">
            <button type="button" class="kvx-call" aria-label="Speak to an agent live" style="border:none;cursor:pointer"><span class="rg" aria-hidden="true"></span><span class="rr" aria-hidden="true"></span><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"></path></svg></button>
          </kira-voice-agent>
        </div>
        <div class="kvx-name">{{ demoName }}</div>
        <div class="kvx-chips">
          <sc-for list="{{ useCases }}" as="uc" hint-placeholder-count="3">
            <button class="kvx-chip" data-on="{{ uc.on }}" onClick="{{ uc.onClick }}">{{ uc.label }}</button>
          </sc-for>
        </div>
        <p style="margin:18px 0 0;font-size:12px;color:#A79E92">Tap the call button, the live call runs right here in your browser. Mic stays on your device.</p>
      </div>
    </sc-if>

    <sc-if value="{{ modeRec }}" hint-placeholder-val="{{ false }}">
      <audio ref="{{ audioRef }}" preload="none" style="display:none"></audio>
      <div class="kvx-recs">
        <sc-for list="{{ samples }}" as="s" hint-placeholder-count="3">
          <button class="kvx-rec" onClick="{{ s.onClick }}" data-playing="{{ s.on }}">
            <span class="orb" style="background-image:url({{ s.orb }})"><span class="pb"><sc-if value="{{ s.isPlaying }}" hint-placeholder-val="{{ false }}"><span class="eqbars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></sc-if><sc-if value="{{ s.isIdle }}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px"><path d="M8 5v14l11-7z"></path></svg></sc-if></span></span>
            <span class="t" style="display:block">{{ s.title }}</span>
            <span class="d" style="display:block">{{ s.desc }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <div class="kvx-foot">
      <a href="#demo" class="btn btn-glow" style="height:46px;padding:0 24px;font-size:14.5px;border-radius:999px">Request a demo</a>
      <a href="Customers.dc.html" class="kvx-cta" style="background:rgba(20,16,12,.07);color:var(--ink)">Customer stories</a>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:820},&quot;industry&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;all&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;Healthcare&quot;,&quot;Financial&quot;,&quot;Business&quot;,&quot;Sports&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ind:0, uc:0, mode:'live', playIdx:-1, playing:false };
  audioRef = React.createRef();

  ORDER(){ return ['Healthcare','Financial','Business','Sports']; }
  ORBS(){ return { Healthcare:'rz/grad-spray2.webp', Financial:'rz/grad-mick2.webp', Business:'rz/grad-vivid2.webp', Sports:'rz/grad-lime2.webp' }; }

  TOKENS(){ return {
    Healthcare:[
      {label:'Post-discharge care', name:'Nic · Heart Care Post-Discharge', token:'df55c925dce942a48159b9d14a3deced', audio:'rz/audio/post-discharge.opus', orb:'rz/grad-prism2.webp', desc:'A real heart-care post-discharge check-in.'},
      {label:'PT intake & booking', name:'Riley · Wrenfield Physical Therapy', token:'ced58fd477a8490faabaf124af8144ff', audio:'rz/audio/spear-rebooking.opus', orb:'rz/grad-violet2.webp', desc:'A new patient booking a physical therapy evaluation.'},
    ],
    Financial:[
      {label:'Card disputes & collections', name:'Nora · Alderway Bank', token:'afc88ae09b7d4975818e68100ed80422'},
    ],
    Business:[
      {label:'Consumer goods · Asahi', name:'David · Asahi Beverages', token:'a2a43d2c4ff74a5988ada4d442e4ae63'},
    ],
    Sports:[
      {label:'Game-day information', name:'Ernie · Fan Engagement', token:'778100d8b208486f8f8acab6b29fd9a4', audio:'rz/audio/events-inquiry.opus', orb:'rz/grad-navy2.webp', desc:'A fan asking about events and seating.'},
      {label:'Premium sales follow-up', name:'Marty · Suite Recovery', token:'bbc93f725de44f4f90d41d02151b7892'},
    ],
  }; }

  CONVEX(){ return 'https://acoustic-ermine-603.convex.cloud'; }

  isAll(){ const p=this.props.industry||'all'; return p==='all'||p==='All'; }
  curKey(){ return this.isAll()? this.ORDER()[this.state.ind] : this.props.industry; }
  demos(){ return this.TOKENS()[this.curKey()] || []; }
  curDemo(){ const d=this.demos(); return d[this.state.uc] || d[0] || {label:'',name:'',token:''}; }
  samples(){ const key = (typeof this.curKey==='function') ? this.curKey() : null; const T = this.TOKENS(); const all = [], mine = []; for (const k of this.ORDER()){ for (const d of (T[k]||[])){ if (d.audio){ all.push(d); if (k === key) mine.push(d); } } } return mine; }
  hasSamples(){ return this.samples().length>0; }

  _fixMode(){ if(this.state.mode==='rec' && !this.hasSamples()){ this.setState({mode:'live'}); } }
  setInd(i){ this._stopAudio(); this.setState({ind:i, uc:0, callLive:false}, ()=>this._fixMode()); }
  setUc(i){ this.setState({uc:i}); }
  setMode(m){ if(m==='rec' && !this.hasSamples()) return; if(m!=='rec') this._stopAudio(); this.setState({mode:m}); }

  togglePlay(i){
    const a=this.audioRef.current, s=this.samples()[i];
    if(!a || !s || !s.audio) return;
    if(this.state.playing && this.state.playIdx===i){ try{a.pause();}catch(e){} return; }
    try{ if((a.getAttribute('src')||'')!==s.audio){ a.src=s.audio; } a.currentTime=0; }catch(e){}
    this.setState({playIdx:i});
    const p=a.play(); if(p&&p.catch) p.catch(()=>{});
  }
  _stopAudio(){ const a=this.audioRef.current; if(a){ try{a.pause(); a.currentTime=0;}catch(e){} } if(this.state.playing) this.setState({playing:false}); }
  _bindAudio(){
    const a=this.audioRef.current; if(!a || a._bound) return; a._bound=true;
    a.addEventListener('play',()=>{ if(!this.state.playing) this.setState({playing:true}); });
    a.addEventListener('pause',()=>{ if(this.state.playing) this.setState({playing:false}); });
    a.addEventListener('ended',()=>{ this.setState({playing:false}); });
  }

  componentDidMount(){
    try{
      if(!window.customElements || !customElements.get('kira-voice-agent')){
        if(!document.getElementById('kira-voice-widget-js')){
          var SOURCES=['rz/voice-widget.js?v=20260709b-livekit','/voice-widget.js?v=20260709b-livekit'];
          var load=function(i){ if(i>=SOURCES.length) return; var s=document.createElement('script');
            if(i===SOURCES.length-1) s.id='kira-voice-widget-js';
            s.src=SOURCES[i]; s.async=true; s.onerror=function(){ load(i+1); }; document.head.appendChild(s); };
          load(0);
        }
      }
    }catch(e){}
    this._bindAudio();
    this._voiceStatus=(e)=>{ const st=e && e.detail && e.detail.status; this.setState({callLive:(st==='connecting'||st==='connected')}); };
    document.addEventListener('kira-voice-status',this._voiceStatus,true);
    this._slide=()=>this._slidePills();
    window.addEventListener('resize',this._slide);
    setTimeout(this._slide,60); setTimeout(this._slide,400); setTimeout(this._slide,1200);
  }
  componentWillUnmount(){ window.removeEventListener('resize',this._slide); document.removeEventListener('kira-voice-status',this._voiceStatus,true); }
  componentDidUpdate(){ this._bindAudio(); this._slidePills(); }
  _slidePills(){
    document.querySelectorAll('.kvx .kvx-mode, .kvx .kvx-tabs').forEach((box)=>{
      let s=box.querySelector(':scope > .pillslide');
      if(!s){ s=document.createElement('span'); s.className='pillslide'; box.prepend(s); }
      const on=box.querySelector('[data-on="1"]');
      if(on){ s.style.left=on.offsetLeft+'px'; s.style.width=on.offsetWidth+'px'; s.style.opacity='1';
        /* carousel: keep the active pill in view */
        if(box.scrollWidth>box.clientWidth+2){
          const L=on.offsetLeft-10, R=on.offsetLeft+on.offsetWidth+10;
          if(L<box.scrollLeft) box.scrollTo({left:L,behavior:'smooth'});
          else if(R>box.scrollLeft+box.clientWidth) box.scrollTo({left:R-box.clientWidth,behavior:'smooth'});
        }
      }
      else { s.style.opacity='0'; }
    });
  }

  renderVals(){
    const key=this.curKey(), cur=this.curDemo(), orbs=this.ORBS();
    const live=this.state.mode==='live';
    return {
      sub:this.isAll()?'Pick an industry, then speak to an agent live, or listen to real recorded calls.':'Speak to an agent live, or listen to real recorded calls.',
      industries: this.isAll()
        ? this.ORDER().map((k,i)=>({label:k, orb:orbs[k], on:i===this.state.ind?'1':'0', onClick:()=>this.setInd(i)}))
        : [{label:key, orb:orbs[key], on:'1', onClick:()=>{}}],
      useCases: this.demos().map((d,i)=>({label:d.label, on:i===this.state.uc?'1':'0', onClick:()=>this.setUc(i)})),
      demoName: cur.name || cur.label,
      demoToken: cur.token,
      convexUrl: this.CONVEX(),
      orbImg: orbs[key] || 'rz/grad-spray2.webp',
      modeLive: live,
      modeRec: !live,
      liveOn: live?'1':'0',
      recOn: live?'0':'1',
      setLive: ()=>this.setMode('live'),
      setRec: ()=>this.setMode('rec'),
      showModeToggle: true,
      recDisabled: this.hasSamples() ? '0' : '1',
      callLive: this.state.callLive ? '1' : '0',
      audioRef: this.audioRef,
      samples: this.samples().map((d,i)=>{
        const on = this.state.playing && this.state.playIdx===i;
        return { title:d.name||d.label, desc:d.desc||'', orb:d.orb||'rz/grad-night2.webp', on:on?'1':'0', isPlaying:on, isIdle:!on, onClick:()=>this.togglePlay(i) };
      }),
    };
  }
}
</script>
</body>
</html>
